# =============================================================================
# Spark Defaults — Iceberg + Polaris REST Catalog + MinIO S3
# =============================================================================
# These settings configure Spark to use Apache Iceberg as the table format
# with Polaris as the REST catalog and MinIO as S3-compatible storage.
#
# Environment variables (set in docker-compose.yml) override these defaults:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
# =============================================================================

# -- Iceberg Catalog (Polaris REST) --
spark.sql.catalog.iceberg                                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                               rest
spark.sql.catalog.iceberg.uri                                http://polaris:8181/api/catalog
spark.sql.catalog.iceberg.warehouse                          iceberg2
spark.sql.catalog.iceberg.credential                         root:s3cr3t00
spark.sql.catalog.iceberg.scope                              PRINCIPAL_ROLE:ALL
spark.sql.catalog.iceberg.token-refresh-enabled              true

# -- S3 / MinIO storage --
spark.sql.catalog.iceberg.io-impl                            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint                        http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access               true

# -- Iceberg extensions --
spark.sql.extensions                                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                                     iceberg

# -- Performance tuning --
spark.sql.adaptive.enabled                                   true
spark.sql.adaptive.coalescePartitions.enabled                true
spark.serializer                                             org.apache.spark.serializer.KryoSerializer
