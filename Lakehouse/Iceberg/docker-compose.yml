services:
  # 1. MinIO (S3-compatible Object Storage)
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - 9000:9000 # API Port
      - 9001:9001 # Console Port
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    networks:
      - iceberg_net
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 1b. MinIO Init — auto-create required S3 buckets (one-shot)
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
    networks:
      - iceberg_net
    volumes:
      - ./scripts/init-minio-buckets.sh:/init-minio-buckets.sh
    entrypoint: ["/bin/sh", "/init-minio-buckets.sh"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # 2. Apache Polaris (Iceberg REST Catalog)
  polaris:
    image: apache/polaris:1.3.0-incubating
    container_name: polaris
    ports:
      - 8181:8181 # REST Catalog API
      - 8182:8182 # Management / Health
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL_S3=http://minio:9000
      - AWS_ENDPOINT_URL_STS=http://minio:9000
      - AWS_S3_FORCE_PATH_STYLE=true
      - JAVA_TOOL_OPTIONS=-Daws.s3UsePathStyleAccess=true
      - POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,${POLARIS_ROOT_CLIENT_ID},${POLARIS_ROOT_CLIENT_SECRET}
    networks:
      - iceberg_net
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8182/q/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 2b. Polaris Init — create warehouse & namespaces (one-shot)
  polaris-init:
    image: curlimages/curl:8.12.1
    container_name: polaris-init
    environment:
      - POLARIS_URL=http://polaris:8181
      - POLARIS_ROOT_CLIENT_ID=${POLARIS_ROOT_CLIENT_ID}
      - POLARIS_ROOT_CLIENT_SECRET=${POLARIS_ROOT_CLIENT_SECRET}
      - ICEBERG_WAREHOUSE=${ICEBERG_WAREHOUSE}
      - ICEBERG_NAMESPACE=${ICEBERG_NAMESPACE}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=us-east-1
    networks:
      - iceberg_net
    volumes:
      - ./scripts/init-polaris-catalog.sh:/init-polaris-catalog.sh
    entrypoint: ["/bin/sh", "/init-polaris-catalog.sh"]
    depends_on:
      polaris:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  # 3. Trino (Distributed SQL Query Engine)
  trino:
    image: trinodb/trino:479
    container_name: trino
    dns_search: []
    ports:
      - 8900:8080 # Trino Web UI & JDBC
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - POLARIS_CREDENTIAL=${POLARIS_ROOT_CLIENT_ID}:${POLARIS_ROOT_CLIENT_SECRET}
      - ICEBERG_WAREHOUSE=${ICEBERG_WAREHOUSE}
    entrypoint: ["/bin/bash", "/opt/trino-init/init-catalog.sh"]
    networks:
      - iceberg_net
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties
      - ./trino/catalog/iceberg.properties.template:/etc/trino/catalog/iceberg.properties.template
      - ./trino/init-catalog.sh:/opt/trino-init/init-catalog.sh
      # Named volume replaces ${USER_DATA_PATH} bind mount for Windows compat.
      # On Linux, override via docker-compose.override.yml if host path needed.
      - trino_user_data:/tmp/trino_data
      - ./nuscenes_experiment:/opt/nuscenes_experiment
    depends_on:
      polaris:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\"\\|\"ACTIVE\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 4. Lakehouse API Middleware (Isaac Sim Extension target)
  lakehouse-api:
    build:
      context: ../../api_service
      dockerfile: Dockerfile
    container_name: lakehouse-api
    ports:
      - 8100:8000 # API exposed to host (Isaac Sim reaches via host gateway)
    environment:
      # -- Polaris REST Catalog (OAuth2) --
      - ICEBERG_CATALOG_URI=http://polaris:8181/api/catalog
      - POLARIS_CREDENTIAL=${POLARIS_ROOT_CLIENT_ID}:${POLARIS_ROOT_CLIENT_SECRET}
      - POLARIS_SCOPE=PRINCIPAL_ROLE:ALL
      - ICEBERG_WAREHOUSE=${ICEBERG_WAREHOUSE}
      - ICEBERG_NAMESPACE=${ICEBERG_NAMESPACE}
      - ICEBERG_TABLE_NAME=${ICEBERG_TABLE_NAME}
      # -- S3 / MinIO --
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET}
      - S3_USD_PREFIX=${S3_USD_PREFIX}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      # -- Trino --
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - TRINO_CATALOG=iceberg
    networks:
      - iceberg_net
    depends_on:
      polaris:
        condition: service_healthy
      minio:
        condition: service_healthy
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # 5. Web Dashboard (React SPA + nginx reverse proxy)
  dashboard:
    build:
      context: ../../dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - 3000:80 # Web UI exposed to host browser
    networks:
      - iceberg_net
    depends_on:
      lakehouse-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  trino_user_data:
    driver: local

networks:
  iceberg_net:
