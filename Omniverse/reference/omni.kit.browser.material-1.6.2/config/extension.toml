[package]
# Semantic Versionning is used: https://semver.org/
version = "1.6.2"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Material Browser"
description="A browser to show and bind materials."

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ['browser', 'material']

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.rst"

category = "Rendering"
readme  = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.svg"

[dependencies]
"omni.kit.browser.folder.core" = {}
"omni.kit.material.library" = {}
"omni.kit.thumbnails.mdl" = { optional=true }
"omni.kit.viewport.utility" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.menu.utils" = {}
"omni.kit.actions.core" = { optional=true }
"omni.kit.widget.stage" = { optional=true }

# Main python module this extension provides, it will be publicly available as "import omni.kit.browser.material".
[[python.module]]
name = "omni.kit.browser.material"

[settings.exts."omni.kit.browser.material"]
folders = [
        "https://omniverse-content-production.s3.us-west-2.amazonaws.com/Materials/2023_1"
    ]
folders_hide_in_category = ["2023_1"]
min_thumbnail_size = 32
max_thumbnail_size = 512

# Materials defined in these folders will force donot cast shadows. For example: ["Glass"]
# Now set it to empty to ignore for all materials
doNotCastShadows.folders = []
doNotCastShadows.exception_files = ["Mirror.mdl"]
load_after_startup = false
enabled = true
data.timeout = 5

[[test]]
dependencies = [
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
    "omni.kit.thumbnails.mdl",
]
args = [
    "--no-window",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/asyncRendering=false",
    "--/rtx/materialDb/syncLoads=true",
    "--/omni.kit.plugin/syncUsdLoads=true",
    "--/rtx/hydra/materialSyncLoads=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/fastShutdown=true", # For ETM Linux test failure
    "--/exts/omni.kit.browser.material/folders/0=http://omniverse-content-production.s3-us-west-2.amazonaws.com/Materials/Base/Architecture",
    "--/exts/omni.kit.browser.material/folders/1=http://omniverse-content-production.s3-us-west-2.amazonaws.com/Materials/vMaterials_2/Carpet",
    "--/exts/omni.kit.browser.material/doNotCastShadows/folders/0=Carpet",
    "--/exts/omni.kit.browser.material/load_after_startup=true",
    "--/app/window/width=800",
    "--/app/window/height=600",
]

stdoutFailPatterns.exclude = [
    "*Failed to acquire interface [omni::kit::renderer::IGpuFoundation v0.2]*", # Leak
]