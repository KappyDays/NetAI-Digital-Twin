<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congestion Timeline — Lakehouse Dashboard</title>

    <!-- Chart.js 4.x + date adapter + zoom plugin (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ─── Header ─── */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 .badge {
            font-size: 0.65rem;
            background: var(--accent);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ─── Controls ─── */
        .control-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
        }

        select, input[type="datetime-local"], input[type="number"] {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.8rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button:hover { background: var(--accent-hover); }

        button.secondary {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        button.secondary:hover {
            border-color: var(--accent);
        }

        button.danger { background: var(--danger); }

        /* ─── Time range presets ─── */
        .time-presets {
            display: flex;
            gap: 4px;
        }

        .time-presets button {
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
        }

        .time-presets button.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .time-presets button:hover {
            border-color: var(--accent);
        }

        /* ─── Stats bar ─── */
        .stats-bar {
            padding: 12px 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            min-width: 140px;
            flex: 1;
        }

        .stat-card .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-card .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .stat-card .stat-sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ─── Chart container ─── */
        .chart-container {
            padding: 16px 24px;
            position: relative;
        }

        .chart-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            position: relative;
        }

        .chart-wrapper canvas {
            width: 100% !important;
            max-height: 480px;
        }

        .chart-help {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 8px;
        }

        .chart-help kbd {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 1px 5px;
            font-family: monospace;
            font-size: 0.7rem;
        }

        /* ─── Loading overlay ─── */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Status indicator ─── */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.ok { background: var(--success); }
        .status-dot.error { background: var(--danger); }
        .status-dot.loading { background: var(--warning); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ─── Auto-refresh toggle ─── */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            background: var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle.active { background: var(--accent); }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle.active::after { transform: translateX(16px); }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .control-bar { flex-direction: column; align-items: stretch; }
            .stats-bar { flex-direction: column; }
            .stat-card { min-width: auto; }
        }

        /* ─── Empty state ─── */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }
        .empty-state p { margin-top: 8px; font-size: 0.85rem; }
    </style>
</head>
<body>

<!-- ═══════════════════════ HEADER ═══════════════════════ -->
<div class="header">
    <h1>
        Congestion Timeline
        <span class="badge">Lakehouse</span>
    </h1>
    <div class="header-controls">
        <div class="toggle-container">
            <span class="status-dot ok" id="statusDot"></span>
            <span style="font-size:0.75rem; color:var(--text-secondary)" id="statusText">Ready</span>
        </div>
        <div class="toggle-container">
            <label style="font-size:0.75rem; color:var(--text-secondary)">Auto-refresh</label>
            <div class="toggle" id="autoRefreshToggle" onclick="toggleAutoRefresh()"></div>
            <select id="refreshInterval" style="width:60px" onchange="updateRefreshInterval()">
                <option value="5">5s</option>
                <option value="10" selected>10s</option>
                <option value="30">30s</option>
                <option value="60">60s</option>
            </select>
        </div>
        <button class="secondary" onclick="resetZoom()">Reset Zoom</button>
        <button onclick="fetchData()">Refresh</button>
    </div>
</div>

<!-- ═══════════════════════ CONTROLS ═══════════════════════ -->
<div class="control-bar">
    <!-- Time range presets -->
    <div class="control-group">
        <label>Range:</label>
        <div class="time-presets" id="timePresets">
            <button data-range="5m">5m</button>
            <button data-range="15m">15m</button>
            <button data-range="30m">30m</button>
            <button data-range="1h" class="active">1h</button>
            <button data-range="6h">6h</button>
            <button data-range="24h">24h</button>
            <button data-range="7d">7d</button>
            <button data-range="all">All</button>
        </div>
    </div>

    <!-- Custom time range -->
    <div class="control-group">
        <label>From:</label>
        <input type="datetime-local" id="startTime" step="1">
        <label>To:</label>
        <input type="datetime-local" id="endTime" step="1">
    </div>

    <!-- Bucket size -->
    <div class="control-group">
        <label>Bucket:</label>
        <select id="bucketSeconds">
            <option value="10">10s</option>
            <option value="30">30s</option>
            <option value="60" selected>1 min</option>
            <option value="300">5 min</option>
            <option value="600">10 min</option>
            <option value="1800">30 min</option>
            <option value="3600">1 hour</option>
        </select>
    </div>

    <!-- Space filter -->
    <div class="control-group">
        <label>Space:</label>
        <select id="spaceFilter">
            <option value="">All Spaces</option>
        </select>
    </div>
</div>

<!-- ═══════════════════════ STATS BAR ═══════════════════════ -->
<div class="stats-bar">
    <div class="stat-card">
        <div class="stat-label">Data Points</div>
        <div class="stat-value" id="statDataPoints">—</div>
        <div class="stat-sub" id="statTimeRange">No data loaded</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Peak Congestion</div>
        <div class="stat-value" id="statPeakCongestion">—</div>
        <div class="stat-sub" id="statPeakTime">—</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Active Spaces</div>
        <div class="stat-value" id="statActiveSpaces">—</div>
        <div class="stat-sub" id="statAvgObjects">—</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Last Updated</div>
        <div class="stat-value" id="statLastUpdated">—</div>
        <div class="stat-sub" id="statLatency">—</div>
    </div>
</div>

<!-- ═══════════════════════ CHART ═══════════════════════ -->
<div class="chart-container">
    <div class="chart-wrapper" id="chartWrapper">
        <canvas id="congestionChart"></canvas>
        <div class="loading-overlay hidden" id="loadingOverlay">
            <div class="spinner"></div>
        </div>
    </div>
    <div class="chart-help">
        <kbd>Scroll</kbd> to zoom &middot;
        <kbd>Click + Drag</kbd> to pan &middot;
        <kbd>Double-click</kbd> to reset zoom &middot;
        Time axis auto-scales to data range
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  Configuration
// ═══════════════════════════════════════════════════════════════════

const API_BASE = window.location.origin + '/api/v1';
const SPACE_COLORS = [
    '#3b82f6', '#22c55e', '#eab308', '#ef4444', '#a855f7',
    '#ec4899', '#14b8a6', '#f97316', '#06b6d4', '#8b5cf6',
    '#64748b', '#84cc16', '#e11d48', '#0ea5e9', '#d946ef',
];

let chart = null;
let autoRefreshTimer = null;
let isAutoRefresh = false;
let currentPreset = '1h';
let knownSpaces = new Set();

// ═══════════════════════════════════════════════════════════════════
//  Initialization
// ═══════════════════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
    initChart();
    bindPresetButtons();
    setDefaultTimeRange('1h');
    fetchSpaces();
    fetchData();
});

function initChart() {
    const ctx = document.getElementById('congestionChart').getContext('2d');

    chart = new Chart(ctx, {
        type: 'line',
        data: { datasets: [] },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        color: '#94a3b8',
                        usePointStyle: true,
                        pointStyle: 'circle',
                        padding: 16,
                        font: { size: 11 },
                    },
                },
                tooltip: {
                    backgroundColor: '#1e293b',
                    titleColor: '#f1f5f9',
                    bodyColor: '#f1f5f9',
                    borderColor: '#334155',
                    borderWidth: 1,
                    padding: 12,
                    displayColors: true,
                    callbacks: {
                        title: function(items) {
                            if (!items.length) return '';
                            const d = new Date(items[0].parsed.x);
                            return d.toLocaleString();
                        },
                        label: function(ctx) {
                            return ` ${ctx.dataset.label}: ${ctx.parsed.y} objects`;
                        },
                    },
                },
                zoom: {
                    pan: {
                        enabled: true,
                        mode: 'x',
                        modifierKey: null,
                    },
                    zoom: {
                        wheel: { enabled: true, speed: 0.1 },
                        pinch: { enabled: true },
                        drag: {
                            enabled: false,
                        },
                        mode: 'x',
                        onZoomComplete: function({ chart }) {
                            updateStatsFromVisibleData(chart);
                        },
                    },
                    limits: {
                        x: { minRange: 10000 },  // min 10s visible
                    },
                },
            },
            scales: {
                x: {
                    type: 'time',
                    time: {
                        displayFormats: {
                            second: 'HH:mm:ss',
                            minute: 'HH:mm',
                            hour: 'HH:mm',
                            day: 'MMM dd',
                        },
                        tooltipFormat: 'yyyy-MM-dd HH:mm:ss',
                    },
                    title: {
                        display: true,
                        text: 'Time',
                        color: '#94a3b8',
                        font: { size: 12, weight: '500' },
                    },
                    grid: {
                        color: 'rgba(51, 65, 85, 0.5)',
                    },
                    ticks: {
                        color: '#94a3b8',
                        font: { size: 10 },
                        maxRotation: 0,
                        autoSkip: true,
                        maxTicksLimit: 12,
                    },
                },
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Object Count',
                        color: '#94a3b8',
                        font: { size: 12, weight: '500' },
                    },
                    grid: {
                        color: 'rgba(51, 65, 85, 0.5)',
                    },
                    ticks: {
                        color: '#94a3b8',
                        font: { size: 10 },
                        stepSize: 1,
                        precision: 0,
                    },
                },
            },
            animation: {
                duration: 400,
                easing: 'easeOutQuart',
            },
        },
    });

    // Double-click to reset zoom
    document.getElementById('congestionChart').addEventListener('dblclick', () => {
        chart.resetZoom();
    });
}

// ═══════════════════════════════════════════════════════════════════
//  Data Fetching
// ═══════════════════════════════════════════════════════════════════

async function fetchData() {
    const overlay = document.getElementById('loadingOverlay');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    overlay.classList.remove('hidden');
    statusDot.className = 'status-dot loading';
    statusText.textContent = 'Fetching...';

    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    const bucketSeconds = document.getElementById('bucketSeconds').value;
    const spaceId = document.getElementById('spaceFilter').value;

    const params = new URLSearchParams();
    if (startTime) params.set('start_time', new Date(startTime).toISOString());
    if (endTime) params.set('end_time', new Date(endTime).toISOString());
    params.set('bucket_seconds', bucketSeconds);
    params.set('limit', '10000');
    if (spaceId) params.set('space_id', spaceId);

    const t0 = performance.now();

    try {
        const resp = await fetch(`${API_BASE}/congestion/timeseries?${params}`);
        if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
        }

        const data = await resp.json();
        const latency = Math.round(performance.now() - t0);

        updateChart(data);
        updateStats(data, latency);

        statusDot.className = 'status-dot ok';
        statusText.textContent = 'Connected';
    } catch (err) {
        console.error('Fetch error:', err);
        statusDot.className = 'status-dot error';
        statusText.textContent = 'Error';

        // Show empty state with demo data on error
        showDemoData();
    } finally {
        overlay.classList.add('hidden');
    }
}

async function fetchSpaces() {
    try {
        // Try to get current congestion to discover spaces
        const resp = await fetch(`${API_BASE}/congestion`);
        if (resp.ok) {
            const data = await resp.json();
            const select = document.getElementById('spaceFilter');
            if (data.spaces) {
                data.spaces.forEach(s => {
                    if (!knownSpaces.has(s.space_id)) {
                        knownSpaces.add(s.space_id);
                        const opt = document.createElement('option');
                        opt.value = s.space_id;
                        opt.textContent = s.space_id;
                        select.appendChild(opt);
                    }
                });
            }
        }
    } catch (e) {
        console.warn('Could not fetch spaces:', e);
    }
}

// ═══════════════════════════════════════════════════════════════════
//  Chart Update
// ═══════════════════════════════════════════════════════════════════

function updateChart(data) {
    if (!data.rows || data.rows.length === 0) {
        chart.data.datasets = [];
        chart.update();
        return;
    }

    // data.columns: [space_id, time_bucket, object_count]
    const colIdx = {};
    data.columns.forEach((c, i) => colIdx[c] = i);

    // Group by space_id
    const spaceData = {};
    const allSpaces = new Set();

    data.rows.forEach(row => {
        const spaceId = row[colIdx['space_id']] || 'unknown';
        const timeBucket = row[colIdx['time_bucket']];
        const objectCount = row[colIdx['object_count']];

        allSpaces.add(spaceId);
        if (!spaceData[spaceId]) spaceData[spaceId] = [];
        spaceData[spaceId].push({
            x: new Date(timeBucket).getTime(),
            y: objectCount,
        });
    });

    // Update space filter dropdown with newly discovered spaces
    const select = document.getElementById('spaceFilter');
    allSpaces.forEach(s => {
        if (!knownSpaces.has(s)) {
            knownSpaces.add(s);
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            select.appendChild(opt);
        }
    });

    // Sort each space's data by time
    Object.values(spaceData).forEach(pts => pts.sort((a, b) => a.x - b.x));

    // Build datasets
    const spaceIds = Object.keys(spaceData).sort();
    const datasets = spaceIds.map((spaceId, idx) => {
        const color = SPACE_COLORS[idx % SPACE_COLORS.length];
        return {
            label: spaceId,
            data: spaceData[spaceId],
            borderColor: color,
            backgroundColor: color + '20',
            borderWidth: 2,
            pointRadius: spaceData[spaceId].length > 100 ? 0 : 3,
            pointHoverRadius: 5,
            fill: true,
            tension: 0.3,
        };
    });

    chart.data.datasets = datasets;
    chart.update('none');  // skip animation for data updates
}

// ═══════════════════════════════════════════════════════════════════
//  Stats Update
// ═══════════════════════════════════════════════════════════════════

function updateStats(data, latency) {
    const dp = document.getElementById('statDataPoints');
    const tr = document.getElementById('statTimeRange');
    const pc = document.getElementById('statPeakCongestion');
    const pt = document.getElementById('statPeakTime');
    const as = document.getElementById('statActiveSpaces');
    const ao = document.getElementById('statAvgObjects');
    const lu = document.getElementById('statLastUpdated');
    const la = document.getElementById('statLatency');

    dp.textContent = data.row_count.toLocaleString();

    if (data.rows && data.rows.length > 0) {
        const colIdx = {};
        data.columns.forEach((c, i) => colIdx[c] = i);

        // Time range
        const times = data.rows.map(r => new Date(r[colIdx['time_bucket']]).getTime());
        const minT = new Date(Math.min(...times));
        const maxT = new Date(Math.max(...times));
        tr.textContent = `${minT.toLocaleTimeString()} — ${maxT.toLocaleTimeString()}`;

        // Peak congestion
        let peakCount = 0;
        let peakTime = '';
        data.rows.forEach(r => {
            const cnt = r[colIdx['object_count']];
            if (cnt > peakCount) {
                peakCount = cnt;
                peakTime = r[colIdx['time_bucket']];
            }
        });
        pc.textContent = peakCount;
        pt.textContent = peakTime ? new Date(peakTime).toLocaleTimeString() : '—';

        // Active spaces
        const spaces = new Set(data.rows.map(r => r[colIdx['space_id']]));
        as.textContent = spaces.size;

        // Average objects across all buckets
        const totalObjects = data.rows.reduce((s, r) => s + r[colIdx['object_count']], 0);
        const avgPerBucket = (totalObjects / data.rows.length).toFixed(1);
        ao.textContent = `Avg: ${avgPerBucket} obj/bucket`;
    } else {
        tr.textContent = 'No data';
        pc.textContent = '—';
        pt.textContent = '—';
        as.textContent = '0';
        ao.textContent = '—';
    }

    lu.textContent = new Date().toLocaleTimeString();
    la.textContent = `${latency}ms`;
}

function updateStatsFromVisibleData(chart) {
    // Update stats based on visible (zoomed) data range
    const xScale = chart.scales.x;
    if (!xScale) return;

    let visiblePoints = 0;
    let peakCount = 0;
    const spaces = new Set();

    chart.data.datasets.forEach(ds => {
        ds.data.forEach(pt => {
            if (pt.x >= xScale.min && pt.x <= xScale.max) {
                visiblePoints++;
                if (pt.y > peakCount) peakCount = pt.y;
                spaces.add(ds.label);
            }
        });
    });

    document.getElementById('statDataPoints').textContent = visiblePoints.toLocaleString();
    document.getElementById('statPeakCongestion').textContent = peakCount;
    document.getElementById('statActiveSpaces').textContent = spaces.size;
}

// ═══════════════════════════════════════════════════════════════════
//  Demo Data (shown when API is unreachable)
// ═══════════════════════════════════════════════════════════════════

function showDemoData() {
    const now = Date.now();
    const bucketMs = 60000; // 1 minute
    const demoSpaces = ['Room_A', 'Room_B', 'Hallway_01'];
    const datasets = demoSpaces.map((space, idx) => {
        const data = [];
        for (let i = 60; i >= 0; i--) {
            const t = now - i * bucketMs;
            const base = idx === 0 ? 5 : idx === 1 ? 3 : 2;
            const noise = Math.floor(Math.random() * 4) - 1;
            const peak = i > 20 && i < 40 ? Math.floor(Math.random() * 3) + 2 : 0;
            data.push({ x: t, y: Math.max(0, base + noise + peak) });
        }
        const color = SPACE_COLORS[idx];
        return {
            label: `${space} (demo)`,
            data,
            borderColor: color,
            backgroundColor: color + '20',
            borderWidth: 2,
            borderDash: [5, 3],
            pointRadius: 0,
            fill: true,
            tension: 0.3,
        };
    });

    chart.data.datasets = datasets;
    chart.update();

    document.getElementById('statDataPoints').textContent = `${demoSpaces.length * 61} (demo)`;
    document.getElementById('statActiveSpaces').textContent = `${demoSpaces.length} (demo)`;
    document.getElementById('statPeakCongestion').textContent = '~8 (demo)';
    document.getElementById('statLastUpdated').textContent = new Date().toLocaleTimeString();
    document.getElementById('statLatency').textContent = 'N/A';
    document.getElementById('statTimeRange').textContent = 'Demo data — API unavailable';
}

// ═══════════════════════════════════════════════════════════════════
//  Time Range Controls
// ═══════════════════════════════════════════════════════════════════

function bindPresetButtons() {
    document.querySelectorAll('.time-presets button').forEach(btn => {
        btn.addEventListener('click', () => {
            const range = btn.dataset.range;
            setDefaultTimeRange(range);

            // Update active state
            document.querySelectorAll('.time-presets button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPreset = range;

            fetchData();
        });
    });

    // Also fetch on manual time change or filter change
    document.getElementById('bucketSeconds').addEventListener('change', () => fetchData());
    document.getElementById('spaceFilter').addEventListener('change', () => fetchData());
    document.getElementById('startTime').addEventListener('change', () => {
        clearActivePreset();
        fetchData();
    });
    document.getElementById('endTime').addEventListener('change', () => {
        clearActivePreset();
        fetchData();
    });
}

function clearActivePreset() {
    document.querySelectorAll('.time-presets button').forEach(b => b.classList.remove('active'));
    currentPreset = 'custom';
}

function setDefaultTimeRange(preset) {
    const now = new Date();
    let start;

    switch (preset) {
        case '5m':   start = new Date(now - 5 * 60 * 1000); break;
        case '15m':  start = new Date(now - 15 * 60 * 1000); break;
        case '30m':  start = new Date(now - 30 * 60 * 1000); break;
        case '1h':   start = new Date(now - 60 * 60 * 1000); break;
        case '6h':   start = new Date(now - 6 * 60 * 60 * 1000); break;
        case '24h':  start = new Date(now - 24 * 60 * 60 * 1000); break;
        case '7d':   start = new Date(now - 7 * 24 * 60 * 60 * 1000); break;
        case 'all':
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            return;
        default:
            start = new Date(now - 60 * 60 * 1000);
    }

    document.getElementById('startTime').value = toLocalISOString(start);
    document.getElementById('endTime').value = toLocalISOString(now);

    // Auto-adjust bucket size based on range
    const rangeMs = now - start;
    const bucketSelect = document.getElementById('bucketSeconds');
    if (rangeMs <= 10 * 60 * 1000) bucketSelect.value = '10';
    else if (rangeMs <= 30 * 60 * 1000) bucketSelect.value = '30';
    else if (rangeMs <= 2 * 60 * 60 * 1000) bucketSelect.value = '60';
    else if (rangeMs <= 12 * 60 * 60 * 1000) bucketSelect.value = '300';
    else if (rangeMs <= 48 * 60 * 60 * 1000) bucketSelect.value = '600';
    else bucketSelect.value = '3600';
}

function toLocalISOString(date) {
    const pad = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

// ═══════════════════════════════════════════════════════════════════
//  Auto-Refresh
// ═══════════════════════════════════════════════════════════════════

function toggleAutoRefresh() {
    isAutoRefresh = !isAutoRefresh;
    const toggle = document.getElementById('autoRefreshToggle');
    toggle.classList.toggle('active', isAutoRefresh);

    if (isAutoRefresh) {
        startAutoRefresh();
    } else {
        stopAutoRefresh();
    }
}

function startAutoRefresh() {
    stopAutoRefresh();
    const intervalSec = parseInt(document.getElementById('refreshInterval').value) || 10;
    autoRefreshTimer = setInterval(() => {
        // Update end time to "now" if using a preset
        if (currentPreset && currentPreset !== 'custom' && currentPreset !== 'all') {
            setDefaultTimeRange(currentPreset);
        }
        fetchData();
    }, intervalSec * 1000);
}

function stopAutoRefresh() {
    if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
    }
}

function updateRefreshInterval() {
    if (isAutoRefresh) {
        startAutoRefresh();
    }
}

// ═══════════════════════════════════════════════════════════════════
//  Zoom Controls
// ═══════════════════════════════════════════════════════════════════

function resetZoom() {
    if (chart) {
        chart.resetZoom();
    }
}

</script>
