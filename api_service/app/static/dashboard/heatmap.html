<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakehouse Digital Twin - Congestion Heatmap</title>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-card: #1c2333;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --accent-green: #3fb950;
    --accent-red: #f85149;
    --accent-yellow: #d29922;
    --border: #30363d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
  }

  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .header h1 span { color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }
  .status-dot.ok { background: var(--accent-green); }
  .status-dot.err { background: var(--accent-red); }
  .status-dot.loading { background: var(--accent-yellow); animation: pulse 1s infinite; }

  @keyframes pulse { 50% { opacity: 0.4; } }

  .main {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 16px;
    padding: 16px 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  /* Heatmap Canvas Area */
  .heatmap-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #0a0e14;
    border-radius: 6px;
    overflow: hidden;
  }

  #heatmapCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .tooltip {
    position: absolute;
    background: rgba(22, 27, 34, 0.95);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    white-space: nowrap;
  }

  .tooltip.visible { opacity: 1; }
  .tooltip .tt-label { color: var(--text-secondary); }
  .tooltip .tt-value { color: var(--text-primary); font-weight: 600; }

  /* Controls */
  .controls { display: flex; flex-direction: column; gap: 12px; }

  .control-group {
    display: flex; flex-direction: column; gap: 4px;
  }

  .control-group label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .control-group input, .control-group select {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 13px;
    outline: none;
  }

  .control-group input:focus, .control-group select:focus {
    border-color: var(--accent);
  }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-primary);
  }

  .btn-outline:hover { border-color: var(--accent); }

  /* Stats panel */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-item {
    background: var(--bg-secondary);
    border-radius: 6px;
    padding: 10px;
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* Color legend */
  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .legend-gradient {
    flex: 1;
    height: 12px;
    border-radius: 4px;
    background: linear-gradient(to right, #0d1b2a, #1b4965, #62b6cb, #f4d35e, #ee6c4d, #d62828);
  }

  .legend-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* Space list */
  .space-list {
    max-height: 200px;
    overflow-y: auto;
    font-size: 12px;
  }

  .space-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .space-item:last-child { border: none; }

  .space-name { color: var(--text-primary); font-weight: 500; }

  .space-badge {
    background: var(--bg-secondary);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
  }

  /* Auto-refresh indicator */
  .auto-refresh {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .auto-refresh input[type="checkbox"] { accent-color: var(--accent); }

  /* Error message */
  .error-msg {
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid var(--accent-red);
    border-radius: 6px;
    padding: 10px;
    font-size: 12px;
    color: var(--accent-red);
    display: none;
  }

  .error-msg.visible { display: block; }

  /* Responsive */
  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>Lakehouse</span> Digital Twin &mdash; Congestion Heatmap</h1>
  <div class="header-right">
    <span id="apiStatus"><span class="status-dot loading"></span>Connecting...</span>
    <span id="lastUpdate">--</span>
  </div>
</div>

<div class="main">
  <!-- Left: Heatmap + Legend -->
  <div>
    <div class="card" style="margin-bottom:12px;">
      <div class="card-title">Top-View Spatial Congestion Heatmap</div>
      <div class="heatmap-container">
        <canvas id="heatmapCanvas"></canvas>
        <div class="tooltip" id="tooltip"></div>
      </div>
      <div class="legend">
        <span style="font-size:11px;color:var(--text-secondary)">Low</span>
        <div class="legend-gradient"></div>
        <span style="font-size:11px;color:var(--text-secondary)">High</span>
      </div>
      <div class="legend-labels">
        <span>0</span>
        <span id="legendMax">--</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Active Spaces</div>
      <div class="space-list" id="spaceList">
        <div style="color:var(--text-secondary);font-size:12px;">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Right: Controls + Stats -->
  <div>
    <div class="card" style="margin-bottom:12px;">
      <div class="card-title">Statistics</div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="statTotalObjects">--</div>
          <div class="stat-label">Total Objects</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statActiveCells">--</div>
          <div class="stat-label">Active Cells</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statMaxDensity">--</div>
          <div class="stat-label">Max Density</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statGridRes">--</div>
          <div class="stat-label">Grid Size</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div class="card-title">Grid Configuration</div>
      <div class="controls">
        <div class="control-group">
          <label>Grid Resolution</label>
          <select id="gridRes">
            <option value="10">10 x 10</option>
            <option value="20" selected>20 x 20</option>
            <option value="30">30 x 30</option>
            <option value="40">40 x 40</option>
            <option value="50">50 x 50</option>
          </select>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          <div class="control-group">
            <label>X Min</label>
            <input type="number" id="xMin" value="-50" step="10">
          </div>
          <div class="control-group">
            <label>X Max</label>
            <input type="number" id="xMax" value="50" step="10">
          </div>
          <div class="control-group">
            <label>Y Min</label>
            <input type="number" id="yMin" value="-50" step="10">
          </div>
          <div class="control-group">
            <label>Y Max</label>
            <input type="number" id="yMax" value="50" step="10">
          </div>
        </div>
        <div class="control-group">
          <label>Color Scale</label>
          <select id="colorScale">
            <option value="thermal" selected>Thermal (Blue-Red)</option>
            <option value="viridis">Viridis (Purple-Green-Yellow)</option>
            <option value="plasma">Plasma (Purple-Orange-Yellow)</option>
            <option value="grayscale">Grayscale</option>
          </select>
        </div>
        <div class="control-group">
          <label class="auto-refresh">
            <input type="checkbox" id="autoRefresh" checked>
            Auto-refresh every
            <select id="refreshInterval" style="width:60px;padding:2px 4px;">
              <option value="3000">3s</option>
              <option value="5000" selected>5s</option>
              <option value="10000">10s</option>
              <option value="30000">30s</option>
            </select>
          </label>
        </div>
        <button class="btn" id="btnRefresh" onclick="fetchGrid()">Refresh Now</button>
        <button class="btn btn-outline" onclick="generateDemoData()">Load Demo Data</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">API Endpoint</div>
      <div style="font-size:12px;color:var(--text-secondary);word-break:break-all;" id="apiEndpoint">
        GET /api/v1/congestion/grid
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>
</div>

<script>
// =====================================================================
//  Configuration & State
// =====================================================================
const API_BASE = window.location.origin;
let gridData = null;
let refreshTimer = null;
let isLoading = false;

// =====================================================================
//  Color Scales
// =====================================================================
const COLOR_SCALES = {
  thermal: [
    [13, 27, 42],     // deep navy (0.0)
    [27, 73, 101],    // dark teal (0.2)
    [98, 182, 203],   // light blue (0.4)
    [244, 211, 94],   // warm yellow (0.6)
    [238, 108, 77],   // orange-red (0.8)
    [214, 40, 40],    // bright red (1.0)
  ],
  viridis: [
    [68, 1, 84],      // dark purple
    [59, 82, 139],    // blue-purple
    [33, 145, 140],   // teal
    [94, 201, 98],    // green
    [253, 231, 37],   // yellow
    [253, 231, 37],   // yellow (repeat for full range)
  ],
  plasma: [
    [13, 8, 135],     // deep blue
    [126, 3, 168],    // purple
    [204, 71, 120],   // pink
    [248, 149, 64],   // orange
    [240, 249, 33],   // bright yellow
    [240, 249, 33],   // yellow (repeat)
  ],
  grayscale: [
    [20, 20, 30],
    [60, 60, 70],
    [100, 100, 110],
    [150, 150, 160],
    [200, 200, 210],
    [240, 240, 245],
  ],
};

function interpolateColor(t, scaleName) {
  const scale = COLOR_SCALES[scaleName] || COLOR_SCALES.thermal;
  t = Math.max(0, Math.min(1, t));

  const idx = t * (scale.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.min(lo + 1, scale.length - 1);
  const frac = idx - lo;

  const r = Math.round(scale[lo][0] + (scale[hi][0] - scale[lo][0]) * frac);
  const g = Math.round(scale[lo][1] + (scale[hi][1] - scale[lo][1]) * frac);
  const b = Math.round(scale[lo][2] + (scale[hi][2] - scale[lo][2]) * frac);

  return [r, g, b];
}

// =====================================================================
//  Canvas Rendering
// =====================================================================
function renderHeatmap(data) {
  const canvas = document.getElementById('heatmapCanvas');
  const container = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const w = container.clientWidth;
  const h = container.clientHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const { config, grid, max_value } = data;
  const rows = config.rows;
  const cols = config.cols;
  const scaleName = document.getElementById('colorScale').value;

  const padding = 40;
  const gridW = w - 2 * padding;
  const gridH = h - 2 * padding;
  const cellW = gridW / cols;
  const cellH = gridH / rows;

  // Background
  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, w, h);

  // Draw grid cells
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const val = grid[r] ? grid[r][c] || 0 : 0;
      const norm = max_value > 0 ? val / max_value : 0;

      const [cr, cg, cb] = interpolateColor(norm, scaleName);
      const alpha = val > 0 ? Math.max(0.3, norm) : 0.08;

      ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${alpha})`;
      // Flip Y: row 0 = bottom in world coords, top of grid
      const drawR = rows - 1 - r;
      ctx.fillRect(
        padding + c * cellW,
        padding + drawR * cellH,
        cellW - 0.5,
        cellH - 0.5
      );

      // Show count in cell if non-zero and cells are large enough
      if (val > 0 && cellW > 20 && cellH > 20) {
        ctx.fillStyle = norm > 0.5 ? '#fff' : 'rgba(255,255,255,0.7)';
        ctx.font = `${Math.min(12, cellW * 0.35)}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(
          val.toFixed(0),
          padding + c * cellW + cellW / 2,
          padding + drawR * cellH + cellH / 2
        );
      }
    }
  }

  // Axis labels
  ctx.fillStyle = '#8b949e';
  ctx.font = '11px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  // X-axis labels (bottom)
  const xStep = Math.max(1, Math.floor(cols / 10));
  for (let c = 0; c <= cols; c += xStep) {
    const xVal = config.x_min + c * config.cell_width;
    ctx.fillText(xVal.toFixed(0), padding + c * cellW, h - padding + 6);
  }

  // Y-axis labels (left)
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const yStep = Math.max(1, Math.floor(rows / 10));
  for (let r = 0; r <= rows; r += yStep) {
    const yVal = config.y_min + r * config.cell_height;
    const drawR = rows - r;
    ctx.fillText(yVal.toFixed(0), padding - 6, padding + drawR * cellH);
  }

  // Axis titles
  ctx.fillStyle = '#58a6ff';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('X (World Coordinates)', w / 2, h - 2);

  ctx.save();
  ctx.translate(12, h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('Y (World Coordinates)', 0, 0);
  ctx.restore();

  // Grid border
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  ctx.strokeRect(padding, padding, gridW, gridH);

  // Store render metadata for tooltip
  canvas._renderMeta = { padding, cellW, cellH, rows, cols, gridW, gridH };
}

// =====================================================================
//  Tooltip
// =====================================================================
function setupTooltip() {
  const canvas = document.getElementById('heatmapCanvas');
  const tooltip = document.getElementById('tooltip');

  canvas.addEventListener('mousemove', (e) => {
    if (!gridData || !canvas._renderMeta) return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const { padding, cellW, cellH, rows, cols } = canvas._renderMeta;

    const gc = Math.floor((x - padding) / cellW);
    const drawR = Math.floor((y - padding) / cellH);
    const gr = rows - 1 - drawR; // Flip Y back

    if (gc < 0 || gc >= cols || gr < 0 || gr >= rows) {
      tooltip.classList.remove('visible');
      return;
    }

    const val = gridData.grid[gr] ? gridData.grid[gr][gc] || 0 : 0;
    const cfg = gridData.config;
    const xMin = (cfg.x_min + gc * cfg.cell_width).toFixed(1);
    const xMax = (cfg.x_min + (gc + 1) * cfg.cell_width).toFixed(1);
    const yMin = (cfg.y_min + gr * cfg.cell_height).toFixed(1);
    const yMax = (cfg.y_min + (gr + 1) * cfg.cell_height).toFixed(1);

    // Find objects in this cell
    const cellObjs = gridData.cells.filter(c => c.row === gr && c.col === gc);
    const objIds = cellObjs.length > 0 ? cellObjs[0].object_ids : [];

    tooltip.innerHTML = `
      <div><span class="tt-label">Cell:</span> <span class="tt-value">[${gr}, ${gc}]</span></div>
      <div><span class="tt-label">Objects:</span> <span class="tt-value">${val}</span></div>
      <div><span class="tt-label">X:</span> <span class="tt-value">${xMin} ~ ${xMax}</span></div>
      <div><span class="tt-label">Y:</span> <span class="tt-value">${yMin} ~ ${yMax}</span></div>
      ${objIds.length > 0 ? `<div style="margin-top:4px;border-top:1px solid #30363d;padding-top:4px;"><span class="tt-label">IDs:</span> <span class="tt-value">${objIds.slice(0, 5).join(', ')}${objIds.length > 5 ? '...' : ''}</span></div>` : ''}
    `;

    tooltip.style.left = Math.min(x + 12, rect.width - 180) + 'px';
    tooltip.style.top = Math.min(y + 12, rect.height - 100) + 'px';
    tooltip.classList.add('visible');
  });

  canvas.addEventListener('mouseleave', () => {
    tooltip.classList.remove('visible');
  });
}

// =====================================================================
//  API Fetch
// =====================================================================
async function fetchGrid() {
  if (isLoading) return;
  isLoading = true;

  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.textContent = 'Loading...';

  const res_input = document.getElementById('gridRes').value;
  const params = new URLSearchParams({
    x_min: document.getElementById('xMin').value,
    x_max: document.getElementById('xMax').value,
    y_min: document.getElementById('yMin').value,
    y_max: document.getElementById('yMax').value,
    rows: res_input,
    cols: res_input,
  });

  const endpoint = `${API_BASE}/api/v1/congestion/grid?${params}`;
  document.getElementById('apiEndpoint').textContent = `GET /api/v1/congestion/grid?${params}`;

  try {
    const resp = await fetch(endpoint);
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText}`);
    }

    gridData = await resp.json();
    renderHeatmap(gridData);
    updateStats(gridData);
    updateSpaceList();
    setApiStatus('ok', 'Connected');
    hideError();

    const now = new Date().toLocaleTimeString();
    document.getElementById('lastUpdate').textContent = `Updated: ${now}`;
  } catch (err) {
    console.error('Fetch failed:', err);
    setApiStatus('err', 'Error');
    showError(err.message);

    // If no data yet, show demo
    if (!gridData) {
      generateDemoData();
    }
  } finally {
    isLoading = false;
    btn.disabled = false;
    btn.textContent = 'Refresh Now';
  }
}

// =====================================================================
//  Demo Data Generator
// =====================================================================
function generateDemoData() {
  const rows = parseInt(document.getElementById('gridRes').value);
  const cols = rows;
  const xMin = parseFloat(document.getElementById('xMin').value);
  const xMax = parseFloat(document.getElementById('xMax').value);
  const yMin = parseFloat(document.getElementById('yMin').value);
  const yMax = parseFloat(document.getElementById('yMax').value);

  const cellW = (xMax - xMin) / cols;
  const cellH = (yMax - yMin) / rows;

  // Create a grid with some clustered demo data
  const grid = Array.from({ length: rows }, () => Array(cols).fill(0));
  const cells = [];
  let maxVal = 0;
  let totalObjects = 0;

  // Generate 3-4 hotspot clusters
  const hotspots = [
    { cr: rows * 0.3, cc: cols * 0.3, radius: 3, intensity: 8 },
    { cr: rows * 0.7, cc: cols * 0.6, radius: 4, intensity: 12 },
    { cr: rows * 0.5, cc: cols * 0.8, radius: 2, intensity: 6 },
    { cr: rows * 0.2, cc: cols * 0.7, radius: 3, intensity: 5 },
  ];

  for (const hs of hotspots) {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const dist = Math.sqrt((r - hs.cr) ** 2 + (c - hs.cc) ** 2);
        if (dist < hs.radius * 1.5) {
          const falloff = Math.max(0, 1 - dist / (hs.radius * 1.5));
          const val = Math.round(hs.intensity * falloff * (0.7 + Math.random() * 0.3));
          grid[r][c] += val;
        }
      }
    }
  }

  // Add some random noise
  for (let i = 0; i < rows * cols * 0.05; i++) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    grid[r][c] += Math.floor(Math.random() * 3);
  }

  // Collect non-zero cells and compute stats
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c] > 0) {
        maxVal = Math.max(maxVal, grid[r][c]);
        totalObjects += grid[r][c];
        const objIds = Array.from(
          { length: grid[r][c] },
          (_, i) => `obj_${r}_${c}_${i}`
        );
        cells.push({
          row: r, col: c,
          value: grid[r][c],
          x_min: xMin + c * cellW,
          x_max: xMin + (c + 1) * cellW,
          y_min: yMin + r * cellH,
          y_max: yMin + (r + 1) * cellH,
          object_ids: objIds,
        });
      }
    }
  }

  gridData = {
    config: {
      x_min: xMin, x_max: xMax,
      y_min: yMin, y_max: yMax,
      rows, cols,
      cell_width: cellW,
      cell_height: cellH,
    },
    cells,
    grid,
    max_value: maxVal,
    total_objects: totalObjects,
    snapshot_time: new Date().toISOString(),
  };

  renderHeatmap(gridData);
  updateStats(gridData);
  updateSpaceList();
  setApiStatus('ok', 'Demo Mode');
  hideError();
  document.getElementById('lastUpdate').textContent = 'Demo data loaded';
}

// =====================================================================
//  UI Updates
// =====================================================================
function updateStats(data) {
  document.getElementById('statTotalObjects').textContent = data.total_objects;
  document.getElementById('statActiveCells').textContent = data.cells.length;
  document.getElementById('statMaxDensity').textContent = data.max_value.toFixed(0);
  document.getElementById('statGridRes').textContent =
    `${data.config.rows}x${data.config.cols}`;
  document.getElementById('legendMax').textContent = data.max_value.toFixed(0);
}

async function updateSpaceList() {
  const listEl = document.getElementById('spaceList');

  try {
    const resp = await fetch(`${API_BASE}/api/v1/congestion`);
    if (!resp.ok) throw new Error('Failed');
    const data = await resp.json();

    if (data.spaces && data.spaces.length > 0) {
      listEl.innerHTML = data.spaces.map(s => `
        <div class="space-item">
          <span class="space-name">${s.space_id}</span>
          <span class="space-badge">${s.object_count} obj</span>
        </div>
      `).join('');
    } else {
      listEl.innerHTML = '<div style="color:var(--text-secondary);font-size:12px;">No active spaces</div>';
    }
  } catch {
    // Use demo space list if API unavailable
    if (gridData && gridData.cells.length > 0) {
      listEl.innerHTML = `
        <div class="space-item">
          <span class="space-name">Total (all cells)</span>
          <span class="space-badge">${gridData.total_objects} obj</span>
        </div>
        <div class="space-item">
          <span class="space-name">Active cells</span>
          <span class="space-badge">${gridData.cells.length}</span>
        </div>
      `;
    }
  }
}

function setApiStatus(type, text) {
  const el = document.getElementById('apiStatus');
  el.innerHTML = `<span class="status-dot ${type}"></span>${text}`;
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}

function hideError() {
  document.getElementById('errorMsg').classList.remove('visible');
}

// =====================================================================
//  Auto-Refresh
// =====================================================================
function setupAutoRefresh() {
  const checkbox = document.getElementById('autoRefresh');
  const intervalSel = document.getElementById('refreshInterval');

  function updateTimer() {
    clearInterval(refreshTimer);
    if (checkbox.checked) {
      const ms = parseInt(intervalSel.value);
      refreshTimer = setInterval(fetchGrid, ms);
    }
  }

  checkbox.addEventListener('change', updateTimer);
  intervalSel.addEventListener('change', updateTimer);
  updateTimer();
}

// =====================================================================
//  Window Resize
// =====================================================================
function handleResize() {
  if (gridData) {
    renderHeatmap(gridData);
  }
}

// =====================================================================
//  Color Scale Change
// =====================================================================
document.getElementById('colorScale').addEventListener('change', () => {
  if (gridData) renderHeatmap(gridData);
});

// =====================================================================
//  Init
// =====================================================================
window.addEventListener('DOMContentLoaded', () => {
  setupTooltip();
  setupAutoRefresh();
  window.addEventListener('resize', handleResize);

  // Try API first, fall back to demo
  fetchGrid();
});
</script>
</body>
</html>
