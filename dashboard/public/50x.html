<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Unavailable</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { color: #ff6b6b; font-size: 3rem; margin-bottom: 0.5rem; }
    p { color: #999; font-size: 1.1rem; }
    a { color: #00d4aa; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>503</h1>
    <p>The Lakehouse API backend is temporarily unavailable.</p>
    <p>Please check that <code>lakehouse-api</code> is running and try again.</p>
    <p><a href="/">Retry</a></p>
  </div>
</body>
</html>
