# =============================================================================
# NetAI-Digital-Twin — Root Docker Compose Stack
# =============================================================================
# Iceberg Lakehouse + FastAPI Middleware + Web Dashboard
#
# Services (ordered by startup dependency):
#   1. MinIO           — S3-compatible object storage (Iceberg data + USD files)
#   1b. MinIO Init     — One-shot: creates required S3 buckets
#   2. Polaris         — Apache Polaris Iceberg REST catalog (replaces Hive Metastore)
#   2b. Polaris Init   — One-shot: creates warehouse, namespaces (static_db, dynamic_db)
#   3. Trino           — Distributed SQL query engine over Iceberg tables
#   4. Lakehouse API   — FastAPI middleware (Isaac Sim ↔ Lakehouse bridge)
#   5. Spark           — Apache Spark master + worker for batch / schema evolution
#   6. Web Dashboard   — React/Vite SPA + nginx (congestion heatmap visualizer)
#
# Quick start:
#   cp example.env .env   # edit credentials
#   docker compose up -d --build
#
# Architecture notes:
#   - Apache Polaris serves as the Iceberg REST catalog, replacing the traditional
#     Hive Metastore role. All catalog metadata (warehouses, namespaces, tables)
#     is managed via Polaris REST API with OAuth2 authentication.
#   - Static objects: space-unit Iceberg tables (all child Prim paths + properties)
#   - Dynamic objects: per-object Iceberg tables with fixed schema (schema evolution ready)
#   - IoT flow: S3 → Iceberg Lakehouse → Extension/Dashboard query
#
# Port conflict prevention:
#   All host ports are configurable via .env variables (see example.env).
#   DO NOT run Lakehouse/Iceberg/docker-compose.yml simultaneously with this
#   file — they share the same container names and port allocations.
#   Use ONE compose file at a time:
#     - Root docker-compose.yml  (recommended — full stack)
#     - Lakehouse/Iceberg/docker-compose.yml  (standalone lakehouse dev)
#
# Compatibility:
#   - Windows 11 Docker Desktop (named volumes, LF line endings via .gitattributes)
#   - Ubuntu 24.04 headless (systemd / docker compose v2)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. MinIO — S3-compatible Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: dt-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"    # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin1234}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 1b. MinIO Init — One-shot bucket creation (idempotent)
  # ---------------------------------------------------------------------------
  # Creates S3 buckets required by the Iceberg Lakehouse:
  #   - warehouse2: Iceberg table data (Parquet/metadata)
  #   - usd-assets: OpenUSD scene files uploaded via API
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: dt-minio-init
    entrypoint: ["/bin/sh", "/scripts/init-minio-buckets.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-admin1234}
      S3_BUCKET: ${S3_BUCKET:-warehouse2}
    volumes:
      - ./Lakehouse/Iceberg/scripts/init-minio-buckets.sh:/scripts/init-minio-buckets.sh:ro
    networks:
      - lakehouse
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # 2. Apache Polaris — Iceberg REST Catalog
  # ---------------------------------------------------------------------------
  # Polaris provides the Iceberg REST Catalog specification, serving the same
  # logical role as Hive Metastore but with a modern REST/OAuth2 interface.
  # All table metadata, namespace management, and catalog operations go through
  # Polaris, which stores Iceberg metadata files in MinIO/S3.
  polaris:
    image: apache/polaris:1.3.0-incubating
    container_name: dt-polaris
    ports:
      - "${POLARIS_API_PORT:-8181}:8181"      # REST Catalog API
      - "${POLARIS_MGMT_PORT:-8182}:8182"     # Management / Health
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-admin1234}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ENDPOINT_URL_STS: http://minio:9000
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,${POLARIS_ROOT_CLIENT_ID:-root},${POLARIS_ROOT_CLIENT_SECRET:-s3cr3t00}"
    networks:
      - lakehouse
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8182/q/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2b. Polaris Init — One-shot catalog bootstrapping (idempotent)
  # ---------------------------------------------------------------------------
  # Creates warehouse (iceberg2) and namespaces (static_db, dynamic_db)
  # via Polaris Management REST API. Runs once and exits.
  polaris-init:
    image: curlimages/curl:8.12.1
    container_name: dt-polaris-init
    entrypoint: ["/bin/sh", "/scripts/init-polaris-catalog.sh"]
    environment:
      POLARIS_URL: http://polaris:8181
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID:-root}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET:-s3cr3t00}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-iceberg2}
      ICEBERG_NAMESPACE: ${ICEBERG_NAMESPACE:-static_db}
      S3_BUCKET: ${S3_BUCKET:-warehouse2}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./Lakehouse/Iceberg/scripts/init-polaris-catalog.sh:/scripts/init-polaris-catalog.sh:ro
    networks:
      - lakehouse
    depends_on:
      polaris:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  # ---------------------------------------------------------------------------
  # 3. Trino — Distributed SQL over Iceberg
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:479
    container_name: dt-trino
    ports:
      - "${TRINO_PORT:-8900}:8080"            # Web UI & JDBC
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-admin1234}
      POLARIS_CREDENTIAL: "${POLARIS_ROOT_CLIENT_ID:-root}:${POLARIS_ROOT_CLIENT_SECRET:-s3cr3t00}"
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-iceberg2}
    entrypoint: ["/bin/bash", "/opt/trino-init/init-catalog.sh"]
    volumes:
      - ./Lakehouse/Iceberg/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./Lakehouse/Iceberg/trino/catalog/iceberg.properties.template:/etc/trino/catalog/iceberg.properties.template:ro
      - ./Lakehouse/Iceberg/trino/init-catalog.sh:/opt/trino-init/init-catalog.sh:ro
    networks:
      - lakehouse
    depends_on:
      polaris:
        condition: service_healthy
      polaris-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\"\\|\"ACTIVE\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Lakehouse API — FastAPI Middleware (Isaac Sim ↔ Lakehouse)
  # ---------------------------------------------------------------------------
  lakehouse-api:
    build:
      context: ./api_service
      dockerfile: Dockerfile
    image: netai-dt/lakehouse-api:1.0.0
    container_name: dt-lakehouse-api
    ports:
      - "${API_PORT:-8100}:8000"              # REST API (host:container)
    environment:
      # -- Polaris / Iceberg REST Catalog (OAuth2) --
      ICEBERG_CATALOG_URI: http://polaris:8181/api/catalog
      POLARIS_CREDENTIAL: "${POLARIS_ROOT_CLIENT_ID:-root}:${POLARIS_ROOT_CLIENT_SECRET:-s3cr3t00}"
      POLARIS_SCOPE: PRINCIPAL_ROLE:ALL
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-iceberg2}
      ICEBERG_NAMESPACE: ${ICEBERG_NAMESPACE:-static_db}
      ICEBERG_TABLE_NAME: ${ICEBERG_TABLE_NAME:-static_prims}
      # -- S3 / MinIO --
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-warehouse2}
      S3_USD_PREFIX: ${S3_USD_PREFIX:-usd/world_prims/}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-admin1234}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # -- Trino --
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: ${TRINO_USER:-trino}
      TRINO_CATALOG: iceberg
      # -- App --
      DEBUG: ${DEBUG:-false}
    volumes:
      # Named volume for application log persistence (Windows/Ubuntu compatible)
      # Inspect with:  docker exec dt-lakehouse-api ls /app/logs
      - api_logs:/app/logs
    networks:
      - lakehouse
    depends_on:
      polaris:
        condition: service_healthy
      minio:
        condition: service_healthy
      trino:
        condition: service_healthy
      polaris-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 5. Apache Spark — Batch Processing / Schema Evolution
  # ---------------------------------------------------------------------------
  # Spark is configured with Iceberg + S3 (MinIO) integration for:
  #   - Batch ingestion of IoT sensor data into Iceberg tables
  #   - Schema evolution operations on dynamic object tables
  #   - Data compaction and maintenance jobs
  spark:
    build:
      context: ./Lakehouse/Iceberg/spark
      dockerfile: Dockerfile
    image: netai-dt/spark-iceberg:1.0.0
    container_name: dt-spark
    ports:
      - "${SPARK_UI_PORT:-4040}:4040"         # Spark Application UI
      - "${SPARK_MASTER_PORT:-7077}:7077"     # Spark Master
      - "${SPARK_MASTER_UI_PORT:-8180}:8080"  # Spark Master Web UI
    environment:
      SPARK_MODE: master
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-admin1234}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - spark_data:/opt/bitnami/spark/work
      - spark_jars:/opt/bitnami/spark/ivy-jars
    networks:
      - lakehouse
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/json/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  spark-worker:
    build:
      context: ./Lakehouse/Iceberg/spark
      dockerfile: Dockerfile
    image: netai-dt/spark-iceberg:1.0.0
    container_name: dt-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-admin1234}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - spark_worker_data:/opt/bitnami/spark/work
      - spark_jars:/opt/bitnami/spark/ivy-jars
    networks:
      - lakehouse
    depends_on:
      spark:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 6. Web Dashboard — React/Vite SPA + nginx reverse proxy
  # ---------------------------------------------------------------------------
  # Serves the congestion heatmap visualization and space-time analytics.
  # nginx proxies /api requests to the lakehouse-api service.
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: netai-dt/dashboard:1.0.0
    container_name: dt-dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:80"          # nginx serves SPA + proxies /api
    networks:
      - lakehouse
    depends_on:
      lakehouse-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

# =============================================================================
# Named Volumes — Windows 11 Docker Desktop compatible (no host-path bind mounts)
# =============================================================================
volumes:
  minio_data:
    driver: local
  spark_data:
    driver: local
  spark_worker_data:
    driver: local
  spark_jars:
    driver: local
  api_logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  lakehouse:
    name: dt-lakehouse-net
    driver: bridge
